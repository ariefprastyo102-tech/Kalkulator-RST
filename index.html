<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KALKULATOR RENDEMEN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
    padding:15px;
}

.container{
    max-width:1100px;
    margin:auto;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#155eef,#2563eb);
    color:white;
    padding:24px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(37,99,235,.20);
}

.header h1{
    font-size:28px;
    margin-bottom:5px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

/* CARD */
.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.card-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:15px;
}

/* DATA AWAL */
.input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:bold;
    color:#64748b;
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:12px;
    border:1px solid #d9dee8;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.field input:focus{
    border-color:#2563eb;
}

/* TAMBAHAN */
.add-button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.add-button:hover{
    background:#1d4ed8;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th{
    background:#f8fafc;
    color:#64748b;
    font-size:11px;
    padding:9px 4px;
    border-bottom:1px solid #e5e7eb;
}

td{
    padding:5px 3px;
    border-bottom:1px solid #edf0f4;
    text-align:center;
}

td input{
    width:100%;
    padding:9px 4px;
    border:1px solid #d9dee8;
    border-radius:7px;
    text-align:center;
    font-size:14px;
    outline:none;
}

td input:focus{
    border-color:#2563eb;
}

.isi-bendel{
    font-weight:bold;
    color:#155eef;
}

.total-batang{
    font-weight:bold;
}

.volume{
    font-weight:bold;
    font-size:13px;
}

.status{
    font-size:10px;
    margin-top:3px;
}

.status.ok{
    color:#16a34a;
}

.status.error{
    color:#dc2626;
}

.delete{
    background:#fee2e2;
    color:#dc2626;
    border:none;
    border-radius:7px;
    padding:7px 8px;
    cursor:pointer;
}

/* HASIL */
.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.result{
    background:#f8fafc;
    border-radius:12px;
    padding:18px 8px;
    text-align:center;
}

.result-title{
    color:#64748b;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.result-value{
    font-size:21px;
    font-weight:900;
}

.final{
    background:#eff6ff;
    border:1px solid #bfdbfe;
}

.final .result-value{
    color:#155eef;
}

/* MOBILE */
@media(max-width:700px){

    body{
        padding:7px;
    }

    .header{
        padding:18px 15px;
        border-radius:14px;
    }

    .header h1{
        font-size:22px;
    }

    .header p{
        font-size:11px;
    }

    .card{
        padding:11px;
        border-radius:13px;
        margin-bottom:10px;
    }

    .card-title{
        font-size:15px;
        margin-bottom:10px;
    }

    .input-grid{
        gap:7px;
    }

    .field label{
        font-size:9px;
    }

    .field input{
        padding:10px 7px;
        font-size:14px;
    }

    .add-button{
        padding:8px 10px;
        font-size:10px;
    }

    table{
        min-width:0;
    }

    th{
        font-size:8px;
        padding:6px 1px;
        line-height:1.1;
    }

    td{
        padding:3px 1px;
    }

    td input{
        padding:8px 2px;
        font-size:11px;
        border-radius:6px;
    }

    .isi-bendel{
        font-size:11px;
    }

    .total-batang{
        font-size:11px;
    }

    .volume{
        font-size:10px;
    }

    .status{
        font-size:8px;
    }

    .delete{
        padding:6px;
        font-size:10px;
    }

    .result-grid{
        gap:5px;
    }

    .result{
        padding:13px 3px;
    }

    .result-title{
        font-size:8px;
    }

    .result-value{
        font-size:13px;
    }

    .final .result-value{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
    <h1>⚡ KALKULATOR RENDEMEN</h1>
    <p>Perhitungan tambahan kayu dan rendemen final</p>
</div>


<!-- DATA SAAT INI -->
<div class="card">

    <div class="card-title">
        Data Saat Ini
    </div>

    <div class="input-grid">

        <div class="field">
            <label>HASIL SAAT INI (m³)</label>
            <input
                id="hasilSaatIni"
                type="number"
                step="0.000001"
                min="0"
                placeholder="Contoh: 1.673063"
                oninput="hitung()"
            >
        </div>

        <div class="field">
            <label>RENDEMEN SAAT INI (%)</label>
            <input
                id="rendemenSaatIni"
                type="number"
                step="0.01"
                min="0"
                placeholder="Contoh: 25"
                oninput="hitung()"
            >
        </div>

    </div>
</div>


<!-- KAYU TAMBAHAN -->
<div class="card">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:8px;
        margin-bottom:12px;
    ">

        <div class="card-title" style="margin:0;">
            Kayu Tambahan
        </div>

        <button
            class="add-button"
            onclick="tambahBaris()"
        >
            ＋ Tambah
        </button>

    </div>


    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Tebal<br>(mm)</th>
                    <th>Lebar<br>(mm)</th>
                    <th>Panjang<br>(mm)</th>
                    <th>Bendel</th>
                    <th>Isi/<br>Bendel</th>
                    <th>Total<br>Batang</th>
                    <th>Volume<br>(m³)</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="tabelKayu"></tbody>

        </table>

    </div>

</div>


<!-- HASIL -->
<div class="card">

    <div class="card-title">
        Hasil Final
    </div>

    <div class="result-grid">

        <div class="result">
            <div class="result-title">
                TAMBAHAN
            </div>

            <div
                class="result-value"
                id="totalTambahan"
            >
                0,000000 m³
            </div>
        </div>


        <div class="result final">

            <div class="result-title">
                HASIL VOLUME FINAL
            </div>

            <div
                class="result-value"
                id="hasilFinal"
            >
                0,000000 m³
            </div>

        </div>


        <div class="result final">

            <div class="result-title">
                RENDEMEN FINAL
            </div>

            <div
                class="result-value"
                id="rendemenFinal"
            >
                0,00 %
            </div>

        </div>

    </div>

</div>

</div>


<script>

/*
=========================================================
DATABASE ATURAN ISI PER BENDEL
=========================================================
Format:

tebal : [angka yang diperbolehkan]
lebar : [angka yang diperbolehkan]
panjang : aturan panjang
isi : jumlah batang per bendel
=========================================================
*/

const aturan = [

    /* 19 x 160 */
    {t:[19], l:[160], min:2500, max:2900, isi:1},
    {t:[19], l:[160], min:2000, max:2400, isi:1},
    {t:[19], l:[160], min:1500, max:1900, isi:1},

    /* 19 x 130 */
    {t:[19], l:[130], min:2500, max:2900, isi:1},
    {t:[19], l:[130], min:2000, max:2400, isi:1},
    {t:[19], l:[130], min:1500, max:1900, isi:1},
    {t:[19], l:[130], min:1000, max:1400, isi:1},

    /* 19 x 100 */
    {t:[19], l:[100], min:2500, max:2900, isi:1},
    {t:[19], l:[100], min:2000, max:2400, isi:1},
    {t:[19], l:[100], min:1500, max:1900, isi:1},
    {t:[19], l:[100], min:900, max:1400, isi:1},

    /* 18 x 160 */
    {t:[18], l:[160], min:900, max:1400, isi:1},
    {t:[18], l:[160], min:600, max:850, isi:1},
    {t:[18], l:[160], min:300, max:550, isi:10},

    /* 18 x 130 */
    {t:[18], l:[130], min:900, max:1400, isi:1},
    {t:[18], l:[130], min:600, max:850, isi:1},
    {t:[18], l:[130], min:450, max:550, isi:10},
    {t:[18], l:[130], min:300, max:400, isi:10},

    /* 18 x 100 */
    {t:[18], l:[100], min:900, max:1400, isi:1},
    {t:[18], l:[100], min:600, max:850, isi:1},
    {t:[18], l:[100], min:450, max:550, isi:10},
    {t:[18], l:[100], min:300, max:400, isi:10},

    /* 15 x 130 */
    {t:[15], l:[130], min:900, max:1400, isi:1},
    {t:[15], l:[130], min:600, max:850, isi:1},
    {t:[15], l:[130], min:450, max:550, isi:10},
    {t:[15], l:[130], min:300, max:400, isi:10},

    /* 15 x 100 */
    {t:[15], l:[100], min:900, max:1400, isi:1},
    {t:[15], l:[100], min:600, max:850, isi:1},
    {t:[15], l:[100], min:450, max:550, isi:10},
    {t:[15], l:[100], min:300, max:400, isi:10},

    /* 15 x 81 */
    {t:[15], l:[81], min:500, max:550, isi:10},

    /* 18 x 81 */
    {t:[18], l:[81], min:500, max:550, isi:10},

    /* 15 x 60 */
    {t:[15], l:[60], min:900, max:1400, isi:1},
    {t:[15], l:[60], min:600, max:850, isi:10},
    {t:[15], l:[60], min:450, max:550, isi:10},
    {t:[15], l:[60], min:300, max:400, isi:10},

    /* 18 x 60 */
    {t:[18], l:[60], min:900, max:1400, isi:1},
    {t:[18], l:[60], min:600, max:850, isi:10},
    {t:[18], l:[60], min:450, max:550, isi:10},
    {t:[18], l:[60], min:300, max:400, isi:10},

    /* 12/15 x 72/75/80 */
    {t:[12,15], l:[72,75,80], min:900, max:1400, isi:1},
    {t:[12,15], l:[72,75,80], min:600, max:850, isi:10},
    {t:[12,15], l:[72,75,80], min:200, max:550, isi:10},

    /* 12/15 x 65/60 */
    {t:[12,15], l:[65,60], min:900, max:1400, isi:1},
    {t:[12,15], l:[65,60], min:600, max:850, isi:10},
    {t:[12,15], l:[65,60], min:200, max:550, isi:10},

    /* 15 x 52 */
    {t:[15], l:[52], min:400, max:800, isi:20},
    {t:[15], l:[52], min:305, up:true, isi:40},
    {t:[15], l:[52], exact:255, isi:40},
    {t:[15], l:[52], exact:205, isi:40},

    /* 12 x 52 */
    {t:[12], l:[52], min:400, max:800, isi:20},
    {t:[12], l:[52], min:305, up:true, isi:40},
    {t:[12], l:[52], exact:255, isi:40},
    {t:[12], l:[52], exact:205, isi:40},

    /* 12/15 x 52 < 200 */
    {t:[12,15], l:[52], max:199.999999, isi:40},

    /* 15/20 x 35/40/45 */
    {t:[15,20], l:[35,40,45], min:250, up:true, isi:25},

    /* 15/20 x 30 */
    {t:[15,20], l:[30], min:1000, up:true, isi:25},
    {t:[15,20], l:[30], min:400, max:500, isi:25},
    {t:[15,20], l:[30], min:200, max:300, isi:50},
    {t:[15,20], l:[30], min:150, max:200, isi:50},

    /* 15/20 x 20 */
    {t:[15,20], l:[20], min:400, up:true, isi:25},
    {t:[15,20], l:[20], min:200, max:300, isi:50}

];


/* =====================================================
   ROUNDING
===================================================== */

function round6(nilai){

    return Math.round(
        (nilai + Number.EPSILON) * 1000000
    ) / 1000000;

}


/* =====================================================
   FORMAT
===================================================== */

function formatAngka(nilai, desimal=6){

    return nilai.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:desimal,
            maximumFractionDigits:desimal
        }
    );

}


/* =====================================================
   ANGKA
===================================================== */

function angka(nilai){

    return parseFloat(nilai) || 0;

}


/* =====================================================
   CEK ATURAN PANJANG
===================================================== */

function cocokPanjang(rule, panjang){

    if(
        rule.exact !== undefined
    ){

        return panjang === rule.exact;

    }


    if(
        rule.up === true
    ){

        return panjang >= rule.min;

    }


    if(
        rule.min !== undefined &&
        rule.max !== undefined
    ){

        return (
            panjang >= rule.min &&
            panjang <= rule.max
        );

    }


    if(
        rule.max !== undefined
    ){

        return panjang <= rule.max;

    }


    return false;

}


/* =====================================================
   CARI ISI BENDEL
===================================================== */

function cariIsiBendel(
    tebal,
    lebar,
    panjang
){

    for(
        const rule of aturan
    ){

        const cocokTebal =
            rule.t.includes(tebal);

        const cocokLebar =
            rule.l.includes(lebar);


        if(
            cocokTebal &&
            cocokLebar &&
            cocokPanjang(rule,panjang)
        ){

            return rule.isi;

        }

    }


    return null;

}


/* =====================================================
   TAMBAH BARIS
===================================================== */

function tambahBaris(){

    const tbody =
        document.getElementById(
            "tabelKayu"
        );


    const tr =
        document.createElement("tr");


    tr.innerHTML = `

        <td>
            <input
                type="number"
                class="tebal"
                min="0"
                step="1"
                oninput="hitung()"
            >
        </td>

        <td>
            <input
                type="number"
                class="lebar"
                min="0"
                step="1"
                oninput="hitung()"
            >
        </td>

        <td>
            <input
                type="number"
                class="panjang"
                min="0"
                step="1"
                oninput="hitung()"
            >
        </td>

        <td>
            <input
                type="number"
                class="jumlahBendel"
                min="0"
                step="1"
                value="1"
                oninput="hitung()"
            >
        </td>

        <td>
            <div class="isi-bendel">-</div>
            <div class="status"></div>
        </td>

        <td>
            <div class="total-batang">0</div>
        </td>

        <td>
            <div class="volume">0,000000</div>
        </td>

        <td>
            <button
                class="delete"
                onclick="
                    this.closest('tr').remove();
                    hitung();
                "
            >
                ✕
            </button>
        </td>

    `;


    tbody.appendChild(tr);

    hitung();

}


/* =====================================================
   HITUNG
===================================================== */

function hitung(){

    const hasilSaatIni =
        angka(
            document.getElementById(
                "hasilSaatIni"
            ).value
        );


    const rendemenSaatIni =
        angka(
            document.getElementById(
                "rendemenSaatIni"
            ).value
        );


    let totalTambahan = 0;


    const rows =
        document.querySelectorAll(
            "#tabelKayu tr"
        );


    rows.forEach(function(row){

        const tebal =
            angka(
                row.querySelector(
                    ".tebal"
                ).value
            );


        const lebar =
            angka(
                row.querySelector(
                    ".lebar"
                ).value
            );


        const panjang =
            angka(
                row.querySelector(
                    ".panjang"
                ).value
            );


        const jumlahBendel =
            angka(
                row.querySelector(
                    ".jumlahBendel"
                ).value
            );


        const isiElement =
            row.querySelector(
                ".isi-bendel"
            );


        const statusElement =
            row.querySelector(
                ".status"
            );


        const totalBatangElement =
            row.querySelector(
                ".total-batang"
            );


        const volumeElement =
            row.querySelector(
                ".volume"
            );


        /* BELUM LENGKAP */

        if(
            tebal <= 0 ||
            lebar <= 0 ||
            panjang <= 0 ||
            jumlahBendel <= 0
        ){

            isiElement.textContent = "-";

            statusElement.textContent = "";

            totalBatangElement.textContent = "0";

            volumeElement.textContent =
                "0,000000";

            return;

        }


        /* CARI ISI */

        const isi =
            cariIsiBendel(
                tebal,
                lebar,
                panjang
            );


        /* UKURAN TIDAK ADA */

        if(
            isi === null
        ){

            isiElement.textContent =
                "?";

            statusElement.textContent =
                "Ukuran tidak ditemukan";

            statusElement.className =
                "status error";

            totalBatangElement.textContent =
                "0";

            volumeElement.textContent =
                "0,000000";

            return;

        }


        /* UKURAN DITEMUKAN */

        statusElement.textContent =
            "Otomatis";

        statusElement.className =
            "status ok";


        isiElement.textContent =
            isi;


        /* TOTAL BATANG */

        const totalBatang =
            jumlahBendel * isi;


        totalBatangElement.textContent =
            totalBatang;


        /*
        =================================================
        RUMUS EXCEL

        =ROUND(
            (Tebal × Lebar × Panjang × Jumlah Batang)
            / 1.000.000.000;
            6
        )

        PENTING:
        JUMLAH BATANG DIKALIKAN DULU
        BARU ROUND 6 DESIMAL.
        =================================================
        */

        const volume =
            round6(
                (
                    tebal *
                    lebar *
                    panjang *
                    totalBatang
                )
                /
                1000000000
            );


        volumeElement.textContent =
            formatAngka(volume);


        totalTambahan +=
            volume;

    });


    /* HASIL VOLUME FINAL */

    const hasilFinal =
        hasilSaatIni +
        totalTambahan;


    /*
    =================================================
    HITUNG VOLUME LOG DARI RENDEMEN SAAT INI

    Rendemen = Hasil RST / Volume Log × 100

    Volume Log =
    Hasil RST / (Rendemen / 100)
    =================================================
    */

    let volumeLog = 0;


    if(
        rendemenSaatIni > 0 &&
        hasilSaatIni > 0
    ){

        volumeLog =
            hasilSaatIni /
            (
                rendemenSaatIni /
                100
            );

    }


    /* RENDEMEN FINAL */

    let rendemenFinal = 0;


    if(
        volumeLog > 0
    ){

        rendemenFinal =
            (
                hasilFinal /
                volumeLog
            )
            *
            100;

    }


    /* TAMPILKAN */

    document.getElementById(
        "totalTambahan"
    ).textContent =
        formatAngka(
            totalTambahan
        )
        +
        " m³";


    document.getElementById(
        "hasilFinal"
    ).textContent =
        formatAngka(
            hasilFinal
        )
        +
        " m³";


    document.getElementById(
        "rendemenFinal"
    ).textContent =
        formatAngka(
            rendemenFinal,
            2
        )
        +
        " %";

}


/* =====================================================
   BARIS PERTAMA
===================================================== */

tambahBaris();

</script>

</body>
</html>
