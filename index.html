<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Rendemen</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}


/* =========================
   HEADER
========================= */

.header{
    background:linear-gradient(135deg,#155eef,#2563eb);
    color:white;
    padding:28px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(37,99,235,.20);
}

.header h1{
    font-size:30px;
    margin-bottom:6px;
}

.header p{
    opacity:.9;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}


/* =========================
   INPUT DATA AWAL
========================= */

.input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#64748b;
    margin-bottom:8px;
}

.field input{
    width:100%;
    padding:13px;
    border:1px solid #d9dee8;
    border-radius:10px;
    font-size:17px;
    outline:none;
}

.field input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}


/* =========================
   AREA TABEL
========================= */

.table-container{
    width:100%;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th{
    background:#f8fafc;
    color:#64748b;
    font-size:12px;
    padding:12px 5px;
    text-align:center;
    border-bottom:1px solid #e5e7eb;
}

td{
    padding:6px 4px;
    border-bottom:1px solid #edf0f4;
    text-align:center;
}

td input,
td select{
    width:100%;
    padding:9px 5px;
    border:1px solid #d9dee8;
    border-radius:8px;
    outline:none;
    text-align:center;
    font-size:14px;
    background:white;
}

td input:focus,
td select:focus{
    border-color:#2563eb;
}

.volume{
    font-weight:bold;
    font-size:13px;
    white-space:nowrap;
}


/* =========================
   LEBAR KOLOM DESKTOP
========================= */

th:nth-child(1){
    width:11%;
}

th:nth-child(2){
    width:11%;
}

th:nth-child(3){
    width:14%;
}

th:nth-child(4){
    width:10%;
}

th:nth-child(5){
    width:15%;
}

th:nth-child(6){
    width:14%;
}

th:nth-child(7){
    width:17%;
}

th:nth-child(8){
    width:8%;
}


/* =========================
   BUTTON
========================= */

.add-button{
    background:#2563eb;
    color:white;
    border:none;
    padding:11px 16px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.add-button:hover{
    background:#1d4ed8;
}

.delete{
    background:#fee2e2;
    color:#dc2626;
    border:none;
    border-radius:7px;
    padding:8px 9px;
    cursor:pointer;
}


/* =========================
   HASIL
========================= */

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.result{
    background:#f8fafc;
    border-radius:15px;
    padding:22px;
    text-align:center;
}

.result-title{
    color:#64748b;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.result-value{
    font-size:24px;
    font-weight:900;
}

.final{
    background:linear-gradient(135deg,#eff6ff,#dbeafe);
    border:2px solid #bfdbfe;
}

.final .result-value{
    color:#155eef;
    font-size:28px;
}


/* =========================
   HP
========================= */

@media(max-width:750px){

    body{
        padding:8px;
    }

    .header{
        padding:20px 16px;
        border-radius:15px;
    }

    .header h1{
        font-size:23px;
    }

    .header p{
        font-size:12px;
    }

    .card{
        padding:12px;
        border-radius:14px;
        margin-bottom:12px;
    }

    .card-title{
        font-size:16px;
        margin-bottom:12px;
    }


    /* DATA AWAL */

    .input-grid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .field label{
        font-size:10px;
        margin-bottom:5px;
    }

    .field input{
        padding:11px 7px;
        font-size:15px;
    }


    /* TABEL */

    .table-container{
        overflow:hidden;
    }

    table{
        width:100%;
        table-layout:fixed;
    }

    th{
        padding:7px 2px;
        font-size:9px;
        line-height:1.1;
    }

    td{
        padding:4px 2px;
    }

    td input,
    td select{
        padding:8px 2px;
        font-size:11px;
        border-radius:6px;
    }

    .volume{
        font-size:10px;
        white-space:normal;
        line-height:1.1;
    }


    /*
       SINGKATAN HEADER HP
    */

    th:nth-child(1)::after{
        content:"T";
    }

    th:nth-child(2)::after{
        content:"L";
    }

    th:nth-child(3)::after{
        content:"P";
    }

    th:nth-child(4)::after{
        content:"Jml";
    }

    th:nth-child(5)::after{
        content:"Sat";
    }

    th:nth-child(6)::after{
        content:"Isi";
    }

    th:nth-child(7)::after{
        content:"Vol";
    }

    th:nth-child(8)::after{
        content:"";
    }

    th:nth-child(1),
    th:nth-child(2),
    th:nth-child(3),
    th:nth-child(4),
    th:nth-child(5),
    th:nth-child(6),
    th:nth-child(7),
    th:nth-child(8){
        font-size:0;
    }

    th:nth-child(1)::after,
    th:nth-child(2)::after,
    th:nth-child(3)::after,
    th:nth-child(4)::after,
    th:nth-child(5)::after,
    th:nth-child(6)::after,
    th:nth-child(7)::after,
    th:nth-child(8)::after{
        font-size:9px;
    }


    /* LEBAR KOLOM HP */

    th:nth-child(1){
        width:11%;
    }

    th:nth-child(2){
        width:11%;
    }

    th:nth-child(3){
        width:14%;
    }

    th:nth-child(4){
        width:10%;
    }

    th:nth-child(5){
        width:15%;
    }

    th:nth-child(6){
        width:13%;
    }

    th:nth-child(7){
        width:17%;
    }

    th:nth-child(8){
        width:9%;
    }


    /* BUTTON */

    .add-button{
        padding:9px 11px;
        font-size:11px;
        border-radius:8px;
    }

    .delete{
        padding:6px 7px;
        font-size:11px;
    }


    /* HASIL */

    .result-grid{
        grid-template-columns:1fr 1fr 1fr;
        gap:6px;
    }

    .result{
        padding:14px 5px;
        border-radius:10px;
    }

    .result-title{
        font-size:8px;
        margin-bottom:6px;
    }

    .result-value{
        font-size:14px;
    }

    .final .result-value{
        font-size:16px;
    }

}


/* =========================
   HP SANGAT KECIL
========================= */

@media(max-width:380px){

    .result-grid{
        grid-template-columns:1fr;
    }

    .result{
        padding:12px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>⚡ KALKULATOR RENDEMEN</h1>

    <p>
        Perhitungan tambahan kayu dan rendemen final
    </p>

</div>



<!-- =========================
     DATA SAAT INI
========================= -->

<div class="card">

    <div class="card-title">
        Data Saat Ini
    </div>


    <div class="input-grid">


        <div class="field">

            <label>
                HASIL SAAT INI (m³)
            </label>

            <input
                id="hasilSaatIni"
                type="number"
                step="0.000001"
                min="0"
                placeholder="1,673063"
            >

        </div>



        <div class="field">

            <label>
                RENDEMEN SAAT INI (%)
            </label>

            <input
                id="rendemenSaatIni"
                type="number"
                step="0.01"
                min="0"
                placeholder="27,93"
            >

        </div>


    </div>

</div>



<!-- =========================
     KAYU TAMBAHAN
========================= -->

<div class="card">


    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:14px;
        gap:8px;
    ">


        <div class="card-title" style="margin:0;">
            Kayu Tambahan
        </div>


        <button
            class="add-button"
            onclick="tambahBaris()"
        >
            ＋ Tambah Ukuran
        </button>


    </div>



    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Tebal<br>(mm)</th>

                    <th>Lebar<br>(mm)</th>

                    <th>Panjang<br>(cm)</th>

                    <th>Jumlah</th>

                    <th>Satuan</th>

                    <th>Isi / Bendel</th>

                    <th>Volume<br>(m³)</th>

                    <th>Aksi</th>

                </tr>

            </thead>


            <tbody id="tabelKayu"></tbody>

        </table>

    </div>

</div>



<!-- =========================
     HASIL
========================= -->

<div class="card">

    <div class="card-title">
        Hasil Perhitungan
    </div>


    <div class="result-grid">


        <div class="result">

            <div class="result-title">
                TOTAL TAMBAHAN
            </div>

            <div
                class="result-value"
                id="totalTambahan"
            >
                0,000000 m³
            </div>

        </div>



        <div class="result final">

            <div class="result-title">
                HASIL VOLUME FINAL
            </div>

            <div
                class="result-value"
                id="hasilFinal"
            >
                0,000000 m³
            </div>

        </div>



        <div class="result final">

            <div class="result-title">
                RENDEMEN FINAL
            </div>

            <div
                class="result-value"
                id="rendemenFinal"
            >
                0,00 %
            </div>

        </div>


    </div>

</div>


</div>



<script>


/* =========================
   TAMBAH BARIS
========================= */

function tambahBaris(){

    const tabel =
        document.getElementById("tabelKayu");


    const baris =
        document.createElement("tr");


    baris.innerHTML = `

        <td>
            <input
                type="number"
                class="tebal"
                min="0"
                step="0.01"
                oninput="hitung()"
            >
        </td>


        <td>
            <input
                type="number"
                class="lebar"
                min="0"
                step="0.01"
                oninput="hitung()"
            >
        </td>


        <td>
            <input
                type="number"
                class="panjang"
                min="0"
                step="0.01"
                oninput="hitung()"
            >
        </td>


        <td>
            <input
                type="number"
                class="jumlah"
                min="0"
                step="1"
                value="1"
                oninput="hitung()"
            >
        </td>


        <td>

            <select
                class="satuan"
                onchange="ubahSatuan(this);hitung()"
            >

                <option value="Batang">
                    Batang
                </option>

                <option value="Bendel">
                    Bendel
                </option>

            </select>

        </td>


        <td>

            <input
                type="number"
                class="isi"
                min="1"
                step="1"
                placeholder="-"
                disabled
                oninput="hitung()"
            >

        </td>


        <td class="volume">
            0,000000
        </td>


        <td>

            <button
                class="delete"
                onclick="
                    this.closest('tr').remove();
                    hitung();
                "
            >
                ✕
            </button>

        </td>

    `;


    tabel.appendChild(baris);

    hitung();

}



/* =========================
   ANGKA
========================= */

function angka(nilai){

    return parseFloat(nilai) || 0;

}



/* =========================
   ROUND 6 DESIMAL
========================= */

function round6(nilai){

    return Math.round(
        (nilai + Number.EPSILON) * 1000000
    ) / 1000000;

}



/* =========================
   FORMAT ANGKA
========================= */

function formatAngka(
    nilai,
    desimal = 6
){

    return nilai.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:desimal,
            maximumFractionDigits:desimal
        }
    );

}



/* =========================
   BATANG / BENDEL
========================= */

function ubahSatuan(select){

    const baris =
        select.closest("tr");


    const inputIsi =
        baris.querySelector(".isi");


    if(
        select.value === "Bendel"
    ){

        inputIsi.disabled = false;

        inputIsi.placeholder =
            "Batang";

    }

    else{

        inputIsi.disabled = true;

        inputIsi.value = "";

        inputIsi.placeholder =
            "-";

    }

}



/* =========================
   HITUNG
========================= */

function hitung(){


    /* DATA SAAT INI */

    const hasilSaatIni =
        angka(
            document.getElementById(
                "hasilSaatIni"
            ).value
        );


    const rendemenSaatIni =
        angka(
            document.getElementById(
                "rendemenSaatIni"
            ).value
        );



    /* TOTAL TAMBAHAN */

    let totalTambahan = 0;


    const baris =
        document.querySelectorAll(
            "#tabelKayu tr"
        );


    baris.forEach(function(tr){


        const tebal =
            angka(
                tr.querySelector(
                    ".tebal"
                ).value
            );


        const lebar =
            angka(
                tr.querySelector(
                    ".lebar"
                ).value
            );


        const panjang =
            angka(
                tr.querySelector(
                    ".panjang"
                ).value
            );


        const jumlah =
            angka(
                tr.querySelector(
                    ".jumlah"
                ).value
            );


        const satuan =
            tr.querySelector(
                ".satuan"
            ).value;


        const isi =
            angka(
                tr.querySelector(
                    ".isi"
                ).value
            );



        /* JUMLAH AKTUAL */

        let jumlahSatuan =
            jumlah;


        if(
            satuan === "Bendel"
        ){

            jumlahSatuan =
                jumlah * isi;

        }



        /* VOLUME 1 BATANG */

        const volumeSatuBatang =
            round6(
                (
                    tebal *
                    lebar *
                    panjang
                )
                /
                1000000000
            );



        /* VOLUME BARIS */

        const volumeBaris =
            volumeSatuBatang *
            jumlahSatuan;



        /* TAMPILKAN VOLUME */

        tr.querySelector(
            ".volume"
        ).textContent =
            formatAngka(
                volumeBaris
            );



        totalTambahan +=
            volumeBaris;

    });



    /* HASIL VOLUME FINAL */

    const hasilFinal =
        hasilSaatIni +
        totalTambahan;



    /* BASIS RENDEMEN */

    let basisRendemen = 0;


    if(
        rendemenSaatIni > 0
    ){

        basisRendemen =
            hasilSaatIni /
            (
                rendemenSaatIni /
                100
            );

    }



    /* RENDEMEN FINAL */

    let rendemenFinal = 0;


    if(
        basisRendemen > 0
    ){

        rendemenFinal =
            (
                hasilFinal /
                basisRendemen
            )
            *
            100;

    }



    /* HASIL TAMBAHAN */

    document.getElementById(
        "totalTambahan"
    ).textContent =
        formatAngka(
            totalTambahan
        )
        +
        " m³";



    /* HASIL FINAL */

    document.getElementById(
        "hasilFinal"
    ).textContent =
        formatAngka(
            hasilFinal
        )
        +
        " m³";



    /* RENDEMEN FINAL */

    document.getElementById(
        "rendemenFinal"
    ).textContent =
        formatAngka(
            rendemenFinal,
            2
        )
        +
        " %";

}



/* =========================
   INPUT DATA
========================= */

document
    .getElementById(
        "hasilSaatIni"
    )
    .addEventListener(
        "input",
        hitung
    );


document
    .getElementById(
        "rendemenSaatIni"
    )
    .addEventListener(
        "input",
        hitung
    );



/* BARIS PERTAMA */

tambahBaris();

</script>

</body>
</html>
